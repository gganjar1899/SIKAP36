<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>SIKAP 36</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23C2453A'/%3E%3Ctext x='32' y='44' font-size='30' font-weight='800' text-anchor='middle' fill='white' font-family='Arial,sans-serif'%3E36%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--g1:#FFFFFF;--g2:#F7F2FF;--g3:#E9DFFF;--sf:#fff;--ink:#303344;--mute:#5f6174;--line:#E6E0F5;--pri:#6b4fd6;--lav:#A78BFA;--lavl:#F0EAFE;--cor:#E4574A;--corb:#C2453A;--on:#2B9A72;--off:#8C88A6;--mix:100%;--ok:#1d6b45;--err:#a1281c;--sh:0 1px 2px rgba(48,51,68,.06),0 8px 20px rgba(107,79,214,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
:root{color-scheme:light}
*{box-sizing:border-box}html,body{margin:0}
body{color:var(--ink);font:16px/1.55 "Plus Jakarta Sans",system-ui,sans-serif;min-height:100vh;background-color:#FBF8FF;background-image:radial-gradient(120% 55% at 100% 0%,rgba(167,139,250,.20),transparent 62%),radial-gradient(110% 50% at 0% 100%,rgba(255,211,166,.28),transparent 62%),linear-gradient(180deg,#FFFFFF 0%,#FCFAFF 40%,#F1EAFF 100%);background-attachment:fixed}
h1,h2,h3{margin:0;font-family:Lora,Georgia,serif;font-weight:600;line-height:1.2}
.wrap{max-width:480px;margin:0 auto;padding:1rem 1rem 130px}
.top{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.logo{font:800 1.3rem/1 "Plus Jakarta Sans",sans-serif;letter-spacing:1.5px;color:var(--pri);display:flex;align-items:center;gap:.4rem}
.b7{background:var(--corb);color:#fff;border-radius:8px;padding:.1rem .45rem;letter-spacing:0;font-size:1.25rem}
.tl{display:flex;gap:.4rem}
.lk{background:none;border:0;color:var(--pri);font:700 .85rem "Plus Jakarta Sans",sans-serif;cursor:pointer;min-height:44px;padding:0 .4rem}
.date{margin:1.4rem 0 .2rem;color:var(--mute);font-weight:600;font-size:.9rem}
.hello{font-size:2rem}.mute{color:var(--mute);font-size:.92rem}
.card{background:var(--sf);border:1px solid var(--line);border-radius:20px;padding:1rem;box-shadow:var(--sh)}
.sum{margin:1.1rem 0 1.4rem}.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:.55rem}.bar i{display:block;height:100%;background:var(--pri);border-radius:4px}
.sec{font-size:1.3rem;margin:0 0 .7rem}
.row{display:flex;align-items:center;gap:.75rem;background:var(--sf);border:1px solid var(--line);border-radius:20px;padding:.7rem .8rem;margin-bottom:.7rem;box-shadow:var(--sh)}
.row.pop{animation:pop .4s ease}@keyframes pop{50%{transform:scale(1.025)}}
.ic{font-size:1.5rem;width:50px;height:50px;border-radius:15px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--f) var(--mix),var(--sf))}
.nm{flex:1;min-width:0;text-align:left;background:none;border:0;font:inherit;color:inherit;cursor:pointer;min-height:48px;padding:0}
.nm b{display:block;font-weight:700;line-height:1.25}.nm small{display:block;color:var(--mute);font-size:.82rem;font-weight:600}.nm small.d{color:var(--ok)}
.sw{position:relative;width:58px;height:34px;border-radius:99px;border:0;background:var(--off);cursor:pointer;flex:none;padding:0;transition:background .25s}
.sw[aria-checked=true]{background:var(--on)}
.sw i{position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .25s}
.sw[aria-checked=true] i{transform:translateX(24px)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.fab{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 16px rgba(60,40,120,.28);color:#fff;z-index:4}
.fab svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.fl{left:max(16px,calc(50% - 240px + 8px));background:#6b4fd6}.fr{right:max(16px,calc(50% - 240px + 8px));background:#C2453A}
.btn{font:700 .98rem "Plus Jakarta Sans",sans-serif;min-height:46px;padding:.5rem 1.2rem;border-radius:14px;border:0;background:#6b4fd6;color:#fff;cursor:pointer}
.btn:disabled{opacity:.6;cursor:wait}.btn.sec{background:transparent;color:var(--pri);border:1.5px solid var(--pri)}.btn.full{width:100%}
.segc{display:flex;background:var(--lavl);border-radius:14px;padding:4px;margin:.8rem 0 1.1rem}
.segc button{flex:1;min-height:42px;border:0;border-radius:11px;background:none;font:700 .92rem "Plus Jakarta Sans",sans-serif;color:var(--mute);cursor:pointer}
.segc button[aria-pressed=true]{background:var(--sf);color:var(--pri);box-shadow:0 1px 3px rgba(48,51,68,.15)}
.ringw{display:grid;place-items:center;margin:.3rem 0}.ringw svg{width:220px;height:220px}
.ringw text{font:600 44px Lora,serif;fill:var(--ink);text-anchor:middle;dominant-baseline:central}
.lg{display:flex;gap:1.2rem;justify-content:center;font-size:.85rem;color:var(--mute);font-weight:600;margin-bottom:1rem}.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:.35rem}
.pr{display:grid;grid-template-columns:auto 1fr auto;gap:.1rem .7rem;align-items:center;margin:.75rem 0}.pr .ic{width:38px;height:38px;font-size:1.15rem;border-radius:12px}.pr b{font-weight:700;font-size:.92rem}.pr .bar{grid-column:2/-1;margin:0}
.chip{display:inline-block;font-size:.8rem;font-weight:700;color:var(--pri);background:var(--lavl);border-radius:99px;padding:.15rem .7rem;margin:.15rem .3rem 0 0}
label,legend{display:block;font-weight:700;margin:.9rem 0 .35rem;padding:0;font-size:.93rem}
textarea,input[type=text],input[type=password]{width:100%;font:inherit;color:var(--ink);background:var(--sf);border:1.5px solid var(--off);border-radius:12px;padding:.65rem .75rem}
.opts{display:flex;flex-wrap:wrap;gap:.5rem}.opt{display:inline-flex;align-items:center;gap:.4rem;border:1.5px solid var(--line);border-radius:12px;padding:.45rem .8rem;min-height:44px;cursor:pointer;background:var(--sf);margin:0;font-weight:600;font-size:.9rem}
.opt:has(input:checked){border-color:var(--pri);background:var(--lavl)}.opt input{accent-color:#6b4fd6}
.hi{border-left:3px solid var(--lav);padding:.1rem .8rem;margin:.55rem 0;font-size:.93rem}
.apr{background:var(--lavl);border-radius:16px;padding:.85rem 1rem;font-weight:600;margin:1rem 0}
.err{color:var(--err);font-weight:700;margin-top:.5rem}
dialog{border:1px solid var(--line);border-radius:22px;background:var(--sf);color:var(--ink);width:min(92vw,420px);padding:1.2rem}dialog::backdrop{background:rgba(40,30,80,.45)}
.dc{display:flex;gap:.7rem;justify-content:flex-end;margin-top:1rem}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--g1);padding:.55rem 1.1rem;border-radius:99px;font-weight:700;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center;z-index:9}#toast.on{opacity:1}
.lg-wrap{min-height:100vh;display:grid;align-content:center;max-width:420px;margin:0 auto;padding:1.5rem 1rem}
.srow{display:flex;align-items:center;gap:.7rem;background:var(--sf);border:1px solid var(--line);border-radius:18px;padding:.7rem .9rem;margin-bottom:.6rem}
.srow .av{width:42px;height:42px;border-radius:50%;background:var(--lavl);color:var(--pri);display:grid;place-items:center;font-weight:800;flex:none}
.tag{display:inline-block;font-size:.78rem;font-weight:700;border-radius:99px;padding:.05rem .6rem;background:var(--lavl);color:var(--pri);margin:.15rem .3rem 0 0}.tag.w{background:#FFE9CC;color:#8a4b00}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--sf);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{flex:1;min-height:60px;background:none;border:0;border-top:4px solid transparent;font:700 .92rem "Plus Jakarta Sans",sans-serif;color:var(--mute);cursor:pointer}
nav.tabs button[aria-current=page]{color:var(--ink);border-top-color:var(--pri)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.emb{display:block;flex:none;border-radius:50%;background:#fff;padding:7px;border:1px solid var(--line);box-sizing:border-box;box-shadow:var(--sh);object-fit:contain}
.logo .emb{width:40px;height:40px;padding:3px;margin-right:.15rem}
</style></head><body>
<div id="root"></div>
<dialog id="dgr" aria-labelledby="dgrt"><form id="fr" novalidate><h3 id="dgrt" style="font-size:1.4rem">Refleksi hari ini</h3>
<label for="r1">Aktivitas apa yang sudah kamu lakukan?</label><textarea id="r1" rows="2" maxlength="300"></textarea>
<label for="r2">Apa pengalaman yang kamu peroleh?</label><textarea id="r2" rows="2" maxlength="300"></textarea>
<label for="r3">Apa yang ingin diperbaiki besok?</label><textarea id="r3" rows="2" maxlength="300"></textarea><div class="err" id="re" role="alert"></div>
<div class="dc"><button type="button" class="btn sec" id="cx">Batal</button><button type="submit" class="btn" id="rs">Simpan refleksi</button></div></form></dialog>
<dialog id="dgp" aria-labelledby="dgpt"><form id="fp" novalidate><h3 id="dgpt" style="font-size:1.4rem">Ganti kata sandi</h3>
<label for="p1">Kata sandi baru (minimal 8 karakter)</label><input type="password" id="p1" autocomplete="new-password">
<label for="p2">Ulangi kata sandi baru</label><input type="password" id="p2" autocomplete="new-password"><div class="err" id="pe" role="alert"></div>
<div class="dc"><button type="button" class="btn sec" id="px">Batal</button><button type="submit" class="btn" id="ps">Simpan</button></div></form></dialog>
<div id="toast" role="status" aria-live="polite"></div>

/* ---------- SISWA ---------- */
const emap=()=>{const m={};S.entries.filter(e=>e.entry_date===T()).forEach(e=>m[e.habit-1]=e);return m};
const cnt=()=>Object.values(emap()).filter(e=>e.status==="dicatat").length;
const st=e=>!e?"Belum dicatat":e.status==="dilewati"?"Dilewati hari ini, tidak apa-apa":(e.activity?"✓ Sudah dicatat":"✓ Dicatat · belum ada cerita");
function setLocal(i,row){S.entries=S.entries.filter(e=>!(e.entry_date===T()&&e.habit===i+1));if(row)S.entries.push(row)}
async function upsertEntry(i,fields){const row={student_id:S.student.id,entry_date:T(),habit:i+1,status:"dicatat",activity:null,note:null,...fields};
const {error}=await sb.from("habit_entries").upsert(row,{onConflict:"student_id,entry_date,habit"});if(error){toast("Gagal menyimpan. Coba lagi.");return false}setLocal(i,row);return true}
function homeS(){const m=emap(),n=cnt(),tgl=new Date().toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric",timeZone:"Asia/Jakarta"});
return `${topbar()}<p class="date">${tgl}</p><h2 class="hello">Halo, ${esc(titleCase(S.profile.nama).split(" ")[0])}</h2><p class="mute" style="margin:.25rem 0 0">Kelas 9G · Langkah kecil hari ini tetap berarti.</p>
<div class="card sum"><strong>${n} dari 7 kebiasaan dicatat hari ini</strong><div class="bar" role="img" aria-label="${n} dari 7"><i style="width:${n/7*100}%"></i></div><p class="mute" style="margin:.5rem 0 0">Geser tombol saat sudah dilakukan. Ketuk nama untuk menulis cerita atau melewati.</p></div>
<h3 class="sec">Kebiasaanku</h3>${H.map((h,i)=>{const d=m[i],ok=d&&d.status==="dicatat";return `<div class="row ${S.pop===i?"pop":""}" style="--f:${h.f}"><span class="ic" aria-hidden="true">${h.e}</span><button class="nm" data-h="${i}" aria-label="Buka jurnal ${h.n}"><b>${h.n}</b><small class="${ok?"d":""}">${st(d)}</small></button><button class="sw" role="switch" aria-checked="${!!ok}" data-s="${i}" aria-label="Tandai ${h.n} hari ini"><i></i></button></div>`}).join("")}
${fab("fl","gp","Lihat progres saya",ic.chart)}${fab("fr","gr","Tulis refleksi hari ini",ic.plus)}`}
function detailS(){const i=S.hid,h=H[i],d=emap()[i];return `${topbar()}<div style="display:flex;gap:.8rem;align-items:center;margin:1.4rem 0 .6rem"><span class="ic" style="--f:${h.f}" aria-hidden="true">${h.e}</span><h2 style="font-size:1.6rem">${h.n}</h2></div><p style="margin:.2rem 0">${h.d}</p>
<p class="mute" style="margin:.4rem 0 0">Melatih:</p><div>${h.m.map(x=>`<span class="chip">${x}</span>`).join("")}</div><p class="mute" style="margin:.3rem 0 0;font-size:.8rem">Pemetaan awal mengikuti contoh Panduan Kokurikuler. Dimensi sebenarnya ditetapkan guru untuk tiap tema.</p>
<form class="card" id="fj" style="margin-top:1rem" novalidate><fieldset style="border:0;padding:0;margin:0"><legend style="margin-top:0">Aktivitas apa yang kamu lakukan hari ini?</legend><div class="opts">${h.c.concat(["Lainnya (tulis di catatan)"]).map(c=>`<label class="opt"><input type="radio" name="a" value="${esc(c)}" ${d&&d.activity===c?"checked":""}>${esc(c)}</label>`).join("")}</div></fieldset>
<label for="nt">Catatan singkat (boleh dikosongkan)</label><input type="text" id="nt" maxlength="160" value="${d?esc(d.note):""}"><div class="err" id="je" role="alert"></div>
<div style="display:flex;gap:.6rem;margin-top:1rem;flex-wrap:wrap"><button class="btn" type="submit" id="jb">${d&&d.status==="dicatat"?"Perbarui jurnal":"Simpan jurnal"}</button><button class="btn sec" type="button" id="sk">Lewati hari ini</button></div></form>
<h3 class="sec" style="margin-top:1.4rem">Riwayat</h3>${S.entries.filter(e=>e.habit===i+1&&e.activity).sort((a,b)=>b.entry_date.localeCompare(a.entry_date)).slice(0,10).map(e=>`<div class="hi"><strong>${dLabel(e.entry_date)}</strong><br>${esc(e.activity)}${e.note?` · ${esc(e.note)}`:""}</div>`).join("")||'<p class="mute">Belum ada riwayat. Catatan pertamamu akan muncul di sini.</p>'}${fab("fr","bk","Kembali",ic.back)}`}
function ringsvg(p){const c=2*Math.PI*78;return `<svg viewBox="0 0 200 200" role="img" aria-label="Rata-rata kebiasaan dicatat ${p} persen"><circle cx="100" cy="100" r="78" fill="none" stroke="var(--cor)" stroke-width="18"/><circle cx="100" cy="100" r="78" fill="none" stroke="var(--pri)" stroke-width="18" stroke-linecap="round" stroke-dasharray="${c*p/100} ${c}" transform="rotate(-90 100 100)"/><text x="100" y="100">${p}%</text></svg>`}
const bars=(v,l,mx)=>{const w=300/v.length,cl=["#FFE69A","#A8E6CF","#A9D6F5","#FFD3A6","#C3C9F5"];return `<div class="card" style="margin-top:1rem"><strong style="font-size:.92rem">Jumlah kebiasaan dicatat</strong><svg viewBox="0 0 320 140" role="img" aria-label="Grafik jumlah kebiasaan dicatat: ${l.map((x,i)=>x+" "+v[i]).join(", ")}" style="width:100%">${v.map((n,i)=>{const h=n/mx*80,x=10+i*w+w*.18;return `<rect x="${x}" y="${100-h}" width="${w*.64}" height="${Math.max(h,3)}" rx="7" fill="${cl[i%5]}" stroke="#7a6bb0" stroke-width="1.3"/><text x="${x+w*.32}" y="${93-h}" text-anchor="middle" font-size="12" font-weight="700" fill="currentColor">${n}</text><text x="${x+w*.32}" y="122" text-anchor="middle" font-size="11" fill="currentColor" opacity=".75">${l[i]}</text>`}).join("")}</svg></div>`};
const dayCount=d=>S.entries.filter(e=>e.entry_date===d&&e.status==="dicatat").length;
function progS(){const t=S.tab,m=emap(),sk=Object.values(m).filter(e=>e.status==="dilewati").length,days=t==="minggu"?7:30,from=addDays(T(),-(days-1));
const pct=i=>Math.round(new Set(S.entries.filter(e=>e.habit===i+1&&e.status==="dicatat"&&e.entry_date>=from).map(e=>e.entry_date)).size/days*100);
const v=H.map((_,i)=>t==="hari"?(m[i]&&m[i].status==="dicatat"?100:0):pct(i)),p=t==="hari"?Math.round(cnt()/Math.max(1,7-sk)*100):Math.round(v.reduce((a,b)=>a+b,0)/7);
let chart="";if(t==="minggu"){const ds=[...Array(7)].map((_,k)=>addDays(T(),k-6));chart=bars(ds.map(dayCount),ds.map(dowShort),7)}
if(t==="bulan"){const g=[0,1,2,3].map(b=>{let s=0;for(let k=0;k<7;k++)s+=dayCount(addDays(T(),-(27-b*7-(6-k))));return s});chart=bars(g,["Mgg 1","Mgg 2","Mgg 3","Mgg 4"],49)}
const dims=[...new Set(H.flatMap((h,i)=>m[i]&&m[i].status==="dicatat"?h.m:[]))];
return `${topbar()}<h2 style="font-size:1.7rem;margin-top:1.4rem">Progresku</h2><div class="segc" role="group" aria-label="Rentang waktu">${[["hari","Hari"],["minggu","Minggu"],["bulan","Bulan"]].map(([k,l])=>`<button data-t="${k}" aria-pressed="${t===k}">${l}</button>`).join("")}</div>
<div class="ringw">${ringsvg(p)}</div><div class="lg"><span><i style="background:var(--pri)"></i>Dicatat</span><span><i style="background:var(--cor)"></i>Belum dicatat</span></div>${chart}
<div class="card" style="margin-top:1rem">${H.map((h,i)=>`<div class="pr" style="--f:${h.f}"><span class="ic" aria-hidden="true">${h.e}</span><span style="font-weight:700;font-size:.92rem">${h.n}</span><b>${t==="hari"?(m[i]?(m[i].status==="dilewati"?"Dilewati":"Dicatat"):"Belum"):v[i]+"%"}</b><div class="bar"><i style="width:${v[i]}%"></i></div></div>`).join("")}</div>
<div class="apr">${p>=60?"Kamu sudah konsisten. Terima kasih sudah berusaha!":"Setiap catatan adalah langkah. Besok kita coba lagi, pelan-pelan saja."}</div>
<p class="mute">Dimensi yang kamu latih hari ini: ${dims.join(", ")||"belum ada"}.</p><p class="mute">Ini perkembanganmu sendiri, bukan perbandingan dengan teman.</p>
<h3 class="sec" style="margin-top:1.4rem">Riwayat kegiatan</h3>${S.entries.filter(e=>e.activity).sort((a,b)=>b.entry_date.localeCompare(a.entry_date)).slice(0,12).map(e=>`<div class="hi"><strong>${dLabel(e.entry_date)} · ${H[e.habit-1].n}</strong><br>${esc(e.activity)}</div>`).join("")||'<p class="mute">Belum ada riwayat.</p>'}
<h3 class="sec" style="margin-top:1.4rem">Refleksiku</h3>${S.refl.map(r=>`<div class="card" style="margin-bottom:.7rem"><strong>${dLabel(r.entry_date)}</strong><p style="margin:.3rem 0">${esc(r.aktivitas)}</p><p style="margin:.3rem 0">${esc(r.pengalaman)}</p><p class="mute" style="margin:0">Besok: ${esc(r.perbaikan)}</p>${r.umpan_balik?`<p style="margin:.5rem 0 0;color:var(--ok);font-weight:700">Umpan balik guru: ${esc(r.umpan_balik)}</p>`:'<p class="mute" style="margin:.5rem 0 0">Menunggu umpan balik guru.</p>'}</div>`).join("")||'<p class="mute">Belum ada refleksi.</p>'}${fab("fr","bk","Kembali",ic.back)}`}
function renderS(){const go=v=>{S.v=v;S.pop=null;renderS();scrollTo(0,0)};$("#root").innerHTML=`<div class="wrap">${({home:homeS,prog:progS,detail:detailS})[S.v]()}</div>`;wireTop();
const g=(s,f)=>{const e=$(s);if(e)e.onclick=f};g("#gp",()=>go("prog"));g("#bk",()=>go("home"));g("#gr",()=>{$("#re").textContent="";$("#dgr").showModal()});
document.querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>{S.hid=+b.dataset.h;go("detail")});
document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;renderS()});
document.querySelectorAll("[data-s]").forEach(b=>b.onclick=async()=>{const i=+b.dataset.s,d=emap()[i];b.disabled=true;
if(d&&d.status==="dicatat"){const {error}=await sb.from("habit_entries").delete().eq("student_id",S.student.id).eq("entry_date",T()).eq("habit",i+1);if(error){b.disabled=false;toast("Gagal membatalkan. Coba lagi.");return}setLocal(i,null);S.pop=null;renderS();toast("Catatan dibatalkan.")}
else if(await upsertEntry(i,{})){S.pop=i;renderS();toast("Tercatat. Kerja bagus!")}else b.disabled=false});
const sk=$("#sk");if(sk)sk.onclick=async()=>{if(await upsertEntry(S.hid,{status:"dilewati"})){go("home");toast("Tidak apa-apa, boleh dilewati.")}};
const fj=$("#fj");if(fj)fj.onsubmit=async e=>{e.preventDefault();const a=fj.querySelector("[name=a]:checked");if(!a){$("#je").textContent="Pilih satu aktivitas dulu.";return}
const i=S.hid;$("#jb").disabled=true;if(await upsertEntry(i,{activity:a.value,note:$("#nt").value.trim()||null})){S.pop=i;go("home");toast("Tersimpan. Kamu melatih: "+H[i].m.join(", "))}else $("#jb").disabled=false}}

/* ---------- GURU ---------- */
const nameOf=id=>{const s=S.studs.find(x=>x.id===id);return s?titleCase(s.nama):"-"};
const sumOf=id=>S.sum.find(x=>x.student_id===id)||{hari_mencatat:0,mencatat_hari_ini:false,terakhir_mencatat:null};
function sumG(){const n=S.studs.length,hi=S.sum.filter(x=>x.mencatat_hari_ini).length,pend=S.grefl.filter(r=>!r.umpan_balik).length,cut=addDays(T(),-3);
const quiet=S.studs.filter(s=>{const x=sumOf(s.id);return !x.terakhir_mencatat||x.terakhir_mencatat<cut});
return `${topbar()}<p class="date">Kelas ${S.cls?`${S.cls.tingkat}${S.cls.nama}`:"-"} · ${esc(S.profile.nama)}</p><h2 class="hello" style="font-size:1.7rem">Ringkasan kelas</h2>
<div class="card sum"><strong>${hi} dari ${n} siswa sudah mencatat hari ini</strong><div class="bar"><i style="width:${n?hi/n*100:0}%"></i></div><p class="mute" style="margin:.5rem 0 0">Ringkasan ini untuk pendampingan, bukan untuk membandingkan siswa.</p></div>
<h3 class="sec">Refleksi menunggu umpan balik (${pend})</h3>${S.grefl.filter(r=>!r.umpan_balik).slice(0,5).map(r=>`<div class="srow"><span class="av" aria-hidden="true">${esc(nameOf(r.student_id)[0])}</span><span><strong>${esc(nameOf(r.student_id))}</strong><br><span class="mute">${dLabel(r.entry_date)}</span></span></div>`).join("")||'<p class="mute">Tidak ada. Semua sudah dibalas.</p>'}
${pend?'<button class="btn sec" id="gor">Buka semua refleksi</button>':""}
<h3 class="sec" style="margin-top:1.4rem">Perlu disapa (${quiet.length})</h3><p class="mute" style="margin-top:-.4rem">Belum mencatat 3 hari terakhir. Mulai dengan bertanya kabar, bukan menegur.</p>${quiet.map(s=>`<div class="srow"><span class="av" aria-hidden="true">${esc(titleCase(s.nama)[0])}</span><span><strong>${esc(titleCase(s.nama))}</strong><br><span class="mute">${sumOf(s.id).terakhir_mencatat?"Terakhir mencatat "+dLabel(sumOf(s.id).terakhir_mencatat):"Belum pernah mencatat"}</span></span></div>`).join("")||'<p class="mute">Semua siswa aktif mencatat.</p>'}`}
function listG(){return `${topbar()}<h2 class="hello" style="font-size:1.7rem;margin-top:1.4rem">Daftar siswa</h2><p class="mute">Urut abjad, ${S.studs.length} siswa.</p>${S.studs.map(s=>{const x=sumOf(s.id),p=S.grefl.filter(r=>r.student_id===s.id&&!r.umpan_balik).length;return `<div class="srow"><span class="av" aria-hidden="true">${esc(titleCase(s.nama)[0])}</span><span><strong>${esc(titleCase(s.nama))}</strong><br><span class="tag">${x.hari_mencatat}/7 hari mencatat</span>${x.mencatat_hari_ini?'<span class="tag">✓ Hari ini</span>':""}${p?`<span class="tag w">${p} refleksi menunggu</span>`:""}</span></div>`}).join("")}`}
function reflG(){return `${topbar()}<h2 class="hello" style="font-size:1.7rem;margin-top:1.4rem">Refleksi siswa</h2>${S.grefl.map(r=>`<div class="card" style="margin-bottom:.7rem"><strong>${esc(nameOf(r.student_id))}</strong> <span class="mute">· ${dLabel(r.entry_date)}</span><p style="margin:.4rem 0 .2rem"><b>Aktivitas:</b> ${esc(r.aktivitas)}</p><p style="margin:.2rem 0"><b>Pengalaman:</b> ${esc(r.pengalaman)}</p><p style="margin:.2rem 0"><b>Besok:</b> ${esc(r.perbaikan)}</p>${r.umpan_balik?`<p style="color:var(--ok);font-weight:700;margin:.5rem 0 0">Umpan balik: ${esc(r.umpan_balik)}</p>`:`<label for="f${r.id}">Umpan balik</label><input type="text" id="f${r.id}" maxlength="300"><div class="err" id="e${r.id}" role="alert"></div><button class="btn" data-fb="${r.id}" style="margin-top:.6rem">Kirim umpan balik</button>`}</div>`).join("")||'<p class="mute">Belum ada refleksi dari siswa.</p>'}`}
function renderG(){$("#root").innerHTML=`<div class="wrap">${({sum:sumG,list:listG,refl:reflG})[S.gv]()}</div><nav class="tabs" aria-label="Menu guru">${[["sum","Ringkasan"],["list","Siswa"],["refl","Refleksi"]].map(([k,l])=>`<button data-g="${k}" ${k===S.gv?'aria-current="page"':""}>${l}</button>`).join("")}</nav>`;wireTop();
document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{S.gv=b.dataset.g;renderG();scrollTo(0,0)});
const o=$("#gor");if(o)o.onclick=()=>{S.gv="refl";renderG();scrollTo(0,0)};
document.querySelectorAll("[data-fb]").forEach(b=>b.onclick=async()=>{const id=b.dataset.fb,v=$("#f"+id).value.trim();if(!v){$("#e"+id).textContent="Tulis umpan balik dulu.";return}
b.disabled=true;const {error}=await sb.from("reflections").update({umpan_balik:v}).eq("id",id);if(error){b.disabled=false;toast("Gagal mengirim. Coba lagi.");return}
S.grefl.find(r=>r.id===id).umpan_balik=v;renderG();toast("Umpan balik terkirim.")})}

/* ---------- BOOT ---------- */
async function boot(expect){const {data:{user}}=await sb.auth.getUser();if(!user)return false;
const {data:p,error}=await sb.from("profiles").select("role,nama").eq("id",user.id).maybeSingle();if(error||!p)return false;if(expect&&p.role!==expect)return false;S.profile=p;
if(p.role==="siswa"){const {data:s}=await sb.from("students").select("id,nama").maybeSingle();if(!s)return false;S.student=s;
const [en,rf]=await Promise.all([sb.from("habit_entries").select("entry_date,habit,status,activity,note").gte("entry_date",addDays(T(),-29)).limit(1000),sb.from("reflections").select("id,entry_date,aktivitas,pengalaman,perbaikan,umpan_balik").order("created_at",{ascending:false}).limit(20)]);
S.entries=en.data||[];S.refl=rf.data||[];S.v="home";renderS();return true}
if(p.role==="wali_kelas"){const {data:ct}=await sb.from("class_teachers").select("class_id,classes(tingkat,nama)").limit(1);S.cls=ct&&ct[0]?ct[0].classes:null;
const cid=ct&&ct[0]?ct[0].class_id:null;const [ss,sm,rf]=await Promise.all([sb.from("students").select("id,nama").eq("class_id",cid).order("nama"),sb.rpc("ringkasan_kelas"),sb.from("reflections").select("id,student_id,entry_date,aktivitas,pengalaman,perbaikan,umpan_balik").order("created_at",{ascending:false}).limit(100)]);
S.studs=ss.data||[];S.sum=sm.data||[];S.grefl=rf.data||[];S.gv="sum";renderG();return true}
return false}
$("#cx").onclick=()=>$("#dgr").close();$("#px").onclick=()=>$("#dgp").close();
$("#fr").onsubmit=async e=>{e.preventDefault();const a=$("#r1").value.trim(),x=$("#r2").value.trim(),b=$("#r3").value.trim();
if(!a||!x||!b){$("#re").textContent="Isi ketiga pertanyaan agar refleksimu lengkap.";return}
$("#rs").disabled=true;const {data,error}=await sb.from("reflections").insert({student_id:S.student.id,aktivitas:a,pengalaman:x,perbaikan:b}).select("id,entry_date,aktivitas,pengalaman,perbaikan,umpan_balik").single();$("#rs").disabled=false;
if(error){$("#re").textContent="Gagal menyimpan. Coba lagi.";return}S.refl.unshift(data);$("#fr").reset();$("#dgr").close();toast("Refleksi tersimpan.");if(S.v==="prog")renderS()};
$("#fp").onsubmit=async e=>{e.preventDefault();const a=$("#p1").value,b=$("#p2").value,er=$("#pe");
if(a.length<8){er.textContent="Minimal 8 karakter.";return}if(a!==b){er.textContent="Kedua kata sandi tidak sama.";return}
$("#ps").disabled=true;const {error}=await sb.auth.updateUser({password:a});$("#ps").disabled=false;
if(error){er.textContent="Gagal mengganti. Coba kata sandi lain.";return}$("#dgp").close();toast("Kata sandi diganti.")};
(async()=>{const {data:{session}}=await sb.auth.getSession();if(session&&await boot(null))return;loginView()})();
</script></body></html>
